<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif;">
    <header>
        <h1>Scientific Calculator</h1>
    </header>

    <main>
        <form action="./calculato-result.html" method="GET" name="calculatorForm" id="calculatorForm">
            <fieldset>
                <legend>Display</legend>
                <div>
                    <label for="displayArea">Result</label>
                    <input type="text" id="displayArea" name="displayArea" readonly tabindex="1">
                </div>
            </fieldset>

            <fieldset>
                <legend>Input</legend>
                <div>
                    <label for="numberA">Number A</label>
                    <input type="number" id="numberA" name="numberA" required tabindex="2">
                </div>

                <div>
                    <label for="numberB">Number B</label>
                    <input type="number" id="numberB" name="numberB" tabindex="3">
                </div>
            </fieldset>

            <fieldset>
                <legend>Basic Operations</legend>
                <div>
                    <button type="submit" name="op" value="add" tabindex="4">Add</button>
                    <button type="submit" name="op" value="subtract" tabindex="5">Subtract</button>
                    <button type="submit" name="op" value="multiply" tabindex="6">Multiply</button>
                    <button type="submit" name="op" value="divide" tabindex="7">Divide</button>
                </div>
            </fieldset>

            <fieldset>
                <legend>Advanced Operations</legend>
                <div>
                    <button type="submit" name="op" value="power" tabindex="8">Power</button>
                    <button type="submit" name="op" value="sqrt" tabindex="9">Square Root</button>
                    <button type="submit" name="op" value="percent" tabindex="10">Percentage</button>
                </div>
            </fieldset>

            <fieldset>
                <legend>Memory</legend>
                <input type="hidden" id="memoryValue" name="memoryValue" value="">
                <input type="hidden" id="lastResult" name="lastResult" value="">

                <div>
                    <button type="submit" name="mem" value="store" tabindex="11">Store</button>
                    <button type="submit" name="mem" value="recall" tabindex="12">Recall</button>
                    <button type="submit" name="mem" value="clear" tabindex="13">Clear</button>
                </div>
            </fieldset>

            <fieldset>
                <legend>History</legend>
                <ol id="historyList"></ol>
            </fieldset>

            <div>
                <button type="reset" tabindex="14">Clear</button>
                <button type="submit" name="op" value="equals" tabindex="15">Equals</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="footer-class">
            <div>
                <p>&copy; 2025 Sherif&rsaquo; Scientific Calculator. All rights reserved.</p>
                <p>This was last updated <time datetime="2025-12-06">December 6, 2025</time>.</p>
            </div>
        </div>
    </footer>
</body>
</html>
